<!DOCTYPE html>

<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trombone Champ</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

#unityContainer{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    background:#000;
}

#unityContainer canvas{
    display:block;
    width:100%!important;
    height:100%!important;
    outline:none;
}
</style>

</head>

<body>
<div id="unityContainer"></div>

<script>
(function(){

"use strict";

/* =========================================================
   CONFIGURATION
   ========================================================= */

var BUILD =
    "./Build/";

var RAW_ROOT =
    "https://raw.githubusercontent.com/" +
    "AMoldyWaffle/PS2-HTML-ORYX/main/" +
    "Trombone%20Champ/";

var STREAMING_ROOT =
    RAW_ROOT +
    "StreamingAssets/";

var CHUNKED = {
    "web.data.unityweb": 6,
    "web.wasm.code.unityweb": 4
};

var blobUrls = {};


/* =========================================================
   ERROR DISPLAY
   ========================================================= */

function showError(message){

    console.error(message);

    var box = document.createElement("pre");

    box.style.position = "fixed";
    box.style.inset = "0";
    box.style.margin = "0";
    box.style.padding = "20px";
    box.style.background = "#111";
    box.style.color = "#ff7777";
    box.style.font = "14px monospace";
    box.style.whiteSpace = "pre-wrap";
    box.style.overflow = "auto";
    box.style.zIndex = "99999";

    box.textContent = message;

    document.body.appendChild(box);
}


/* =========================================================
   DOWNLOAD
   ========================================================= */

function download(url){

    console.log("[Trombone Champ] GET:", url);

    return fetch(url, {
        cache: "no-store"
    }).then(function(response){

        if(!response.ok){
            throw new Error(
                "HTTP " +
                response.status +
                " while loading:\n" +
                url
            );
        }

        return response.arrayBuffer();
    });
}


/* =========================================================
   CHUNK HANDLING
   ========================================================= */

function getPartURL(name,index){

    return BUILD +
        name +
        (index < 10 ? "0" + index : String(index));
}


function combine(name,count){

    var requests = [];

    for(var i=0;i<count;i++){

        requests.push(
            download(
                getPartURL(name,i)
            )
        );
    }

    return Promise.all(requests).then(function(parts){

        return URL.createObjectURL(
            new Blob(
                parts,
                {
                    type:"application/octet-stream"
                }
            )
        );

    });
}


/* =========================================================
   STREAMING ASSET PATH NORMALIZATION
   ========================================================= */

function normalizePath(path){

    path = String(path);

    path = path.replace(/\\/g,"/");

    try{
        path = decodeURIComponent(path);
    }
    catch(e){}

    while(path.indexOf("//") === 0){
        path = path.substring(1);
    }

    while(path.indexOf("./") === 0){
        path = path.substring(2);
    }

    /*
     * Remove everything before StreamingAssets if Unity
     * supplied an absolute/local URL.
     */
    var marker = "StreamingAssets/";

    var lower = path.toLowerCase();
    var index = lower.indexOf(
        marker.toLowerCase()
    );

    if(index !== -1){
        path = path.substring(
            index + marker.length
        );
    }

    /*
     * Occasionally Unity can produce:
     *
     * StreamingAssets/StreamingAssets/...
     *
     * Avoid duplicating the directory.
     */
    while(
        path.toLowerCase().indexOf(
            "streamingassets/"
        ) === 0
    ){
        path = path.substring(
            "streamingassets/".length
        );
    }

    return path;
}


/* =========================================================
   GITHUB STREAMING ASSET URL
   ========================================================= */

function streamingURL(path){

    path = normalizePath(path);

    /*
     * Encode each path component without encoding "/".
     */
    var pieces = path.split("/");

    for(var i=0;i<pieces.length;i++){

        pieces[i] = encodeURIComponent(
            pieces[i]
        );
    }

    return STREAMING_ROOT +
        pieces.join("/");
}


/* =========================================================
   URL REWRITER
   ========================================================= */

function rewrite(url){

    if(typeof url !== "string"){
        return url;
    }

    var original = url;

    /*
     * -----------------------------------------------------
     * RECONSTRUCTED DATA
     * -----------------------------------------------------
     */

    if(
        url.indexOf(
            "web.data.unityweb"
        ) !== -1 &&
        blobUrls["web.data.unityweb"]
    ){

        return blobUrls[
            "web.data.unityweb"
        ];
    }


    /*
     * -----------------------------------------------------
     * RECONSTRUCTED WASM
     * -----------------------------------------------------
     */

    if(
        url.indexOf(
            "web.wasm.code.unityweb"
        ) !== -1 &&
        blobUrls["web.wasm.code.unityweb"]
    ){

        return blobUrls[
            "web.wasm.code.unityweb"
        ];
    }


    /*
     * -----------------------------------------------------
     * FRAMEWORK
     * -----------------------------------------------------
     */

    if(
        url.indexOf(
            "web.wasm.framework.unityweb"
        ) !== -1
    ){

        return BUILD +
            "web.wasm.framework.unityweb";
    }


    /*
     * -----------------------------------------------------
     * STREAMING ASSETS
     * -----------------------------------------------------
     *
     * Handle all of these possible forms:
     *
     * file:///.../StreamingAssets/foo
     * ./StreamingAssets/foo
     * StreamingAssets/foo
     * /StreamingAssets/foo
     * .../StreamingAssets/foo
     */

    var lower =
        url.toLowerCase();

    var marker =
        "streamingassets/";

    var markerPos =
        lower.indexOf(marker);

    if(markerPos !== -1){

        var path =
            url.substring(
                markerPos + marker.length
            );

        var result =
            streamingURL(path);

        console.log(
            "[Trombone Champ] STREAM:",
            original,
            "->",
            result
        );

        return result;
    }


    /*
     * -----------------------------------------------------
     * DIRECT STREAMINGASSETS FILES
     * -----------------------------------------------------
     *
     * Some Unity builds reference these by their filename
     * after resolving the StreamingAssets base directory.
     */

    var knownFiles = [
        "tracks.json",
        "StreamingAssets",
        "StreamingAssets.manifest"
    ];

    for(var k=0;k<knownFiles.length;k++){

        if(
            lower ===
            knownFiles[k].toLowerCase()
        ){

            return streamingURL(
                knownFiles[k]
            );
        }
    }


    return url;
}


/* =========================================================
   XMLHttpRequest INTERCEPTION
   ========================================================= */

var originalXHRopen =
    XMLHttpRequest.prototype.open;

XMLHttpRequest.prototype.open =
    function(){

        var args =
            Array.prototype.slice.call(
                arguments
            );

        if(args.length >= 2){

            var oldURL =
                args[1];

            var newURL =
                rewrite(oldURL);

            args[1] =
                newURL;
        }

        return originalXHRopen.apply(
            this,
            args
        );
    };


/* =========================================================
   FETCH INTERCEPTION
   ========================================================= */

var originalFetch =
    window.fetch;

window.fetch =
    function(input,options){

        if(typeof input === "string"){

            input =
                rewrite(input);

        }
        else if(
            input &&
            input.url
        ){

            var rewritten =
                rewrite(input.url);

            if(
                rewritten !==
                input.url
            ){

                input =
                    new Request(
                        rewritten,
                        input
                    );
            }
        }

        return originalFetch.call(
            this,
            input,
            options
        );
    };


/* =========================================================
   IMAGE / AUDIO / VIDEO URL INTERCEPTION
   ========================================================= */

function patchURLProperty(proto,property){

    try{

        var descriptor =
            Object.getOwnPropertyDescriptor(
                proto,
                property
            );

        if(
            !descriptor ||
            !descriptor.set
        ){
            return;
        }

        Object.defineProperty(
            proto,
            property,
            {
                configurable: true,

                get: descriptor.get,

                set: function(value){

                    descriptor.set.call(
                        this,
                        rewrite(value)
                    );
                }
            }
        );

    }
    catch(e){
        console.warn(
            "Could not patch " +
            property,
            e
        );
    }
}

patchURLProperty(
    HTMLMediaElement.prototype,
    "src"
);


/* =========================================================
   BUILD UNITY FILES
   ========================================================= */

Promise.all([

    combine(
        "web.data.unityweb",
        CHUNKED[
            "web.data.unityweb"
        ]
    )
    .then(function(url){

        blobUrls[
            "web.data.unityweb"
        ] = url;

    }),

    combine(
        "web.wasm.code.unityweb",
        CHUNKED[
            "web.wasm.code.unityweb"
        ]
    )
    .then(function(url){

        blobUrls[
            "web.wasm.code.unityweb"
        ] = url;

    })

])
.then(function(){

    console.log(
        "[Trombone Champ] Unity files ready."
    );

    var script =
        document.createElement(
            "script"
        );

    script.src =
        BUILD +
        "UnityLoader.js";

    script.onload =
        function(){

            console.log(
                "[Trombone Champ] UnityLoader loaded."
            );

            try{

                UnityLoader.instantiate(
                    "unityContainer",
                    BUILD +
                    "web.json"
                );

            }
            catch(e){

                showError(
                    "Unity failed to start:\n\n" +
                    e.stack
                );
            }
        };

    script.onerror =
        function(){

            showError(
                "Could not load:\n\n" +
                script.src
            );
        };

    document.head.appendChild(
        script
    );

})
.catch(function(e){

    showError(
        "Could not download Trombone Champ:\n\n" +
        e.message
    );

});

})();
</script>

</body>
</html>
