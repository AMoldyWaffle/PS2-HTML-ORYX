<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trombone Champ</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

#unityContainer{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    background:#000;
}

#unityContainer canvas{
    display:block;
    width:100%!important;
    height:100%!important;
    outline:none;
}
</style>
</head>

<body>

<div id="unityContainer"></div>

<script>
(function(){

    /*
     * Build files come from the same Trombone Champ folder.
     */
    var BUILD = "./Build/";


    /*
     * StreamingAssets MUST come from raw GitHub.
     *
     * This is an absolute URL.
     */
    var STREAMING =
        "https://raw.githubusercontent.com/" +
        "AMoldyWaffle/PS2-HTML-ORYX/main/" +
        "Trombone%20Champ/StreamingAssets/";


    /*
     * Split Unity files.
     */
    var CHUNKED = {
        "web.data.unityweb": 6,
        "web.wasm.code.unityweb": 4
    };


    var blobUrls = {};


    /*
     * Download binary data.
     */
    function download(url){

        return fetch(url).then(function(response){

            if(!response.ok){

                throw new Error(
                    "HTTP " +
                    response.status +
                    " while loading " +
                    url
                );

            }

            return response.arrayBuffer();

        });

    }


    /*
     * Get split-file URL.
     */
    function getPartURL(name,index){

        return BUILD +
            name +
            (index < 10 ? "0" + index : index);

    }


    /*
     * Combine split files.
     */
    function combine(name,count){

        var requests=[];

        for(
            var i=0;
            i<count;
            i++
        ){

            requests.push(
                download(
                    getPartURL(name,i)
                )
            );

        }

        return Promise.all(requests)
        .then(function(parts){

            return URL.createObjectURL(
                new Blob(
                    parts,
                    {
                        type:"application/octet-stream"
                    }
                )
            );

        });

    }


    /*
     * =====================================================
     * URL REWRITER
     * =====================================================
     *
     * This is the important part.
     *
     * We don't use ROOT anymore.
     *
     * ANY URL containing:
     *
     *     StreamingAssets/
     *
     * is converted directly to raw GitHub.
     */
    function rewrite(url){

        if(typeof url !== "string"){
            return url;
        }


        /*
         * Split data file.
         */
        if(
            url.indexOf(
                "web.data.unityweb"
            ) !== -1
        ){

            if(
                blobUrls[
                    "web.data.unityweb"
                ]
            ){

                return blobUrls[
                    "web.data.unityweb"
                ];

            }

        }


        /*
         * Split WASM.
         */
        if(
            url.indexOf(
                "web.wasm.code.unityweb"
            ) !== -1
        ){

            if(
                blobUrls[
                    "web.wasm.code.unityweb"
                ]
            ){

                return blobUrls[
                    "web.wasm.code.unityweb"
                ];

            }

        }


        /*
         * Framework.
         */
        if(
            url.indexOf(
                "web.wasm.framework.unityweb"
            ) !== -1
        ){

            return BUILD +
                "web.wasm.framework.unityweb";

        }


        /*
         * =================================================
         * STREAMING ASSETS
         * =================================================
         *
         * Find the StreamingAssets portion regardless of
         * what origin Unity has already attached.
         */
        var marker =
            "StreamingAssets/";

        var pos =
            url.indexOf(marker);


        if(pos !== -1){

            var assetPath =
                url.substring(
                    pos + marker.length
                );

            var result =
                STREAMING +
                assetPath;

            console.log(
                "[Trombone Champ] StreamingAssets:",
                result
            );

            return result;

        }


        return url;

    }


    /*
     * =====================================================
     * XMLHttpRequest interception
     * =====================================================
     */

    var originalOpen =
        XMLHttpRequest.prototype.open;


    XMLHttpRequest.prototype.open =
        function(method,url){

            var args =
                Array.prototype.slice.call(
                    arguments
                );


            var rewritten =
                rewrite(url);


            if(rewritten !== url){

                console.log(
                    "[Trombone Champ] XHR:",
                    url,
                    "->",
                    rewritten
                );

            }


            args[1]=rewritten;


            return originalOpen.apply(
                this,
                args
            );

        };


    /*
     * =====================================================
     * fetch() interception
     * =====================================================
     */

    var originalFetch =
        window.fetch;


    window.fetch =
        function(input,options){

            if(typeof input === "string"){

                input =
                    rewrite(input);

            }

            else if(
                input &&
                input.url
            ){

                var rewritten =
                    rewrite(input.url);


                if(
                    rewritten !==
                    input.url
                ){

                    input =
                        new Request(
                            rewritten,
                            input
                        );

                }

            }


            return originalFetch.call(
                this,
                input,
                options
            );

        };


    /*
     * =====================================================
     * REBUILD UNITY FILES
     * =====================================================
     */

    Promise.all([

        combine(
            "web.data.unityweb",
            6
        )
        .then(function(url){

            blobUrls[
                "web.data.unityweb"
            ]=url;

        }),


        combine(
            "web.wasm.code.unityweb",
            4
        )
        .then(function(url){

            blobUrls[
                "web.wasm.code.unityweb"
            ]=url;

        })

    ])
    .then(function(){

        /*
         * Load UnityLoader.
         */
        var script =
            document.createElement(
                "script"
            );


        script.src =
            BUILD +
            "UnityLoader.js";


        script.onload =
            function(){

                try{

                    UnityLoader.instantiate(
                        "unityContainer",
                        BUILD +
                        "web.json"
                    );

                }
                catch(e){

                    showError(
                        "Unity failed to start:\n\n" +
                        e.message
                    );

                }

            };


        script.onerror =
            function(){

                showError(
                    "Could not load:\n" +
                    script.src
                );

            };


        document.head.appendChild(
            script
        );

    })
    .catch(function(e){

        showError(
            "Could not download Trombone Champ:\n\n" +
            e.message
        );

    });


    /*
     * Error display.
     */
    function showError(message){

        console.error(message);


        var box =
            document.createElement(
                "pre"
            );


        box.style.position="fixed";
        box.style.inset="0";
        box.style.margin="0";
        box.style.padding="20px";
        box.style.background="#111";
        box.style.color="#ff7777";
        box.style.font="14px monospace";
        box.style.whiteSpace="pre-wrap";
        box.style.overflow="auto";
        box.style.zIndex="99999";


        box.textContent=message;


        document.body.appendChild(
            box
        );

    }

})();
</script>

</body>
</html>
