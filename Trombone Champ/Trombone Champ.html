<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trombone Champ</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

#unityContainer{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    background:#000;
}

#unityContainer canvas{
    display:block;
    width:100%!important;
    height:100%!important;
    outline:none;
}
</style>
</head>

<body>

<div id="unityContainer"></div>

<script>
(function(){

    /*
     * Everything is relative to:
     *
     * Trombone Champ/
     *
     * This is important because the game will be
     * hosted by GitHub Pages.
     */

    var ROOT = "./";
    var BUILD = "./Build/";

    /*
     * Split files.
     */
    var CHUNKED = {
        "web.data.unityweb": 6,
        "web.wasm.code.unityweb": 4
    };

    var blobUrls = {};

    /*
     * Download a binary file.
     */
    function download(url){

        return fetch(url).then(function(response){

            if(!response.ok){

                throw new Error(
                    "HTTP " +
                    response.status +
                    " while loading " +
                    url
                );
            }

            return response.arrayBuffer();
        });
    }

    /*
     * Get the URL of a split part.
     */
    function getPartURL(name,index){

        return BUILD +
            name +
            (index < 10 ? "0" + index : index);
    }

    /*
     * Combine all chunks into one Blob.
     */
    function combine(name,count){

        var requests = [];

        for(var i=0;i<count;i++){

            requests.push(
                download(
                    getPartURL(name,i)
                )
            );
        }

        return Promise.all(requests)
        .then(function(parts){

            return URL.createObjectURL(
                new Blob(
                    parts,
                    {
                        type:
                            "application/octet-stream"
                    }
                )
            );

        });
    }

    /*
     * Convert Unity's requests for the split
     * files into the reconstructed Blob URLs.
     */
    function rewrite(url){

        if(typeof url !== "string"){
            return url;
        }

        /*
         * Main data file.
         */
        if(
            url.indexOf(
                "web.data.unityweb"
            ) !== -1
        ){

            if(
                blobUrls[
                    "web.data.unityweb"
                ]
            ){

                return blobUrls[
                    "web.data.unityweb"
                ];
            }
        }

        /*
         * WASM code.
         */
        if(
            url.indexOf(
                "web.wasm.code.unityweb"
            ) !== -1
        ){

            if(
                blobUrls[
                    "web.wasm.code.unityweb"
                ]
            ){

                return blobUrls[
                    "web.wasm.code.unityweb"
                ];
            }
        }

        /*
         * Framework is not split.
         */
        if(
            url.indexOf(
                "web.wasm.framework.unityweb"
            ) !== -1
        ){

            return BUILD +
                "web.wasm.framework.unityweb";
        }

        /*
         * Keep StreamingAssets on the same
         * GitHub Pages origin.
         */
        var marker =
            "StreamingAssets/";

        var pos =
            url.indexOf(marker);

        if(pos !== -1){

            return ROOT +
                url.substring(pos);
        }

        return url;
    }

    /*
     * Patch XMLHttpRequest.
     */
    var originalOpen =
        XMLHttpRequest.prototype.open;

    XMLHttpRequest.prototype.open =
        function(method,url){

            var args =
                Array.prototype.slice.call(
                    arguments
                );

            args[1] = rewrite(url);

            return originalOpen.apply(
                this,
                args
            );
        };

    /*
     * Patch fetch().
     */
    var originalFetch =
        window.fetch;

    window.fetch =
        function(input,options){

            if(typeof input === "string"){

                input = rewrite(input);

            }
            else if(
                input &&
                input.url
            ){

                var newURL =
                    rewrite(input.url);

                if(newURL !== input.url){

                    input =
                        new Request(
                            newURL,
                            input
                        );
                }
            }

            return originalFetch.call(
                this,
                input,
                options
            );
        };

    /*
     * Error display.
     */
    function showError(message){

        console.error(message);

        var box =
            document.createElement("pre");

        box.style.position = "fixed";
        box.style.inset = "0";
        box.style.margin = "0";
        box.style.padding = "20px";
        box.style.background = "#111";
        box.style.color = "#ff7777";
        box.style.font =
            "14px monospace";
        box.style.whiteSpace =
            "pre-wrap";
        box.style.overflow = "auto";
        box.style.zIndex = "99999";

        box.textContent = message;

        document.body.appendChild(box);
    }

    /*
     * Reconstruct the split Unity files.
     */
    Promise.all([

        combine(
            "web.data.unityweb",
            6
        )
        .then(function(url){

            blobUrls[
                "web.data.unityweb"
            ] = url;

        }),

        combine(
            "web.wasm.code.unityweb",
            4
        )
        .then(function(url){

            blobUrls[
                "web.wasm.code.unityweb"
            ] = url;

        })

    ])

    .then(function(){

        /*
         * Load UnityLoader from the same
         * GitHub Pages directory.
         */
        var script =
            document.createElement("script");

        script.src =
            BUILD +
            "UnityLoader.js";

        script.onload =
            function(){

                try{

                    UnityLoader.instantiate(
                        "unityContainer",
                        BUILD + "web.json"
                    );

                }
                catch(e){

                    showError(
                        "Unity failed to start:\n\n" +
                        e.message
                    );

                }

            };

        script.onerror =
            function(){

                showError(
                    "Could not load:\n" +
                    BUILD +
                    "UnityLoader.js"
                );

            };

        document.head.appendChild(script);

    })

    .catch(function(e){

        showError(
            "Could not download Trombone Champ:\n\n" +
            e.message
        );

    });

})();
</script>

</body>
</html>
