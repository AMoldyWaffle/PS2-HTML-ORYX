<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PS2 Core Console Launcher</title>
    <!-- Patches in COOP/COEP headers via a service worker, since GitHub Pages
         (and most static hosts) won't let you set them server-side. Required
         for SharedArrayBuffer / threaded WASM to work. This will reload the
         page once on first load — that's expected. -->
    <script src="coi-serviceworker.js"></script>
    <style>
        body { background: #0c0d12; color: #fff; font-family: system-ui, sans-serif; text-align: center; margin: 0; padding: 20px; }
        #status { font-size: 1.1rem; margin-bottom: 15px; color: #3b82f6; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
        #canvas-container { display: flex; flex-direction: column; align-items: center; margin-top: 10px; }
        canvas { width: 640px; height: 480px; background: #000; border: 3px solid #1f2330; border-radius: 6px; box-shadow: 0 12px 32px rgba(0,0,0,0.6); outline: none; }
        canvas:fullscreen {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            background: #000;
            justify-content: center;
            box-sizing: border-box;
        }
        canvas:fullscreen canvas {
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            max-height: 100vh;
            border: 0;
            border-radius: 0;
            box-shadow: none;
            object-fit: contain;
        }
        canvas:fullscreen #fullscreenButton {
            position: fixed;
            right: 16px;
            bottom: 16px;
            z-index: 10;
            opacity: 0.85;
        }
        canvas:focus { border-color: #3b82f6; }
        #fullscreenButton { margin-top: 10px; padding: 8px 16px; border: 1px solid #2b3140; border-radius: 6px; background: #171a23; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
        #fullscreenButton:hover { background: #222735; }
        .progress-bar { width: 320px; height: 8px; background: #1a1d29; margin: 12px auto; border-radius: 4px; overflow: hidden; border: 1px solid #222; }
        .progress-fill { width: 0%; height: 100%; background: #3b82f6; transition: width 0.05s linear; }
        #pickButton { margin-top: 10px; padding: 10px 20px; border: 1px solid #2b3140; border-radius: 6px; background: #171a23; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
        #pickButton:hover { background: #222735; }
        #fileInput { display: none; }
    </style>
</head>
<body>

    <h1>PlayStation 2</h1>
    <div id="status">Waiting for game file...</div>

    <div id="picker">
        <input type="file" id="fileInput" accept=".bin,.iso">
        <button id="pickButton" type="button">📁 Choose Game File</button>
    </div>

    <div id="p-bar" class="progress-bar" style="display:none;"><div id="progress" class="progress-fill"></div></div>

    <div id="canvas-container" style="display:none;">
        <canvas id="outputCanvas" width="640" height="480" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
        <button id="fullscreenButton" type="button">⛶ Fullscreen</button>
    </div>

    <script type="module">
        const statusElement = document.getElementById('status');
        const progressElement = document.getElementById('progress');
        const progressBar = document.getElementById('p-bar');
        const gameCanvas = document.getElementById('outputCanvas');
        const canvasContainer = document.getElementById('canvas-container');
        const fullscreenButton = document.getElementById('fullscreenButton');
        const fileInput = document.getElementById('fileInput');
        const pickButton = document.getElementById('pickButton');
        const picker = document.getElementById('picker');

        gameCanvas.addEventListener('click', () => gameCanvas.focus());

        fullscreenButton.addEventListener('click', async () => {
            try {
                if (!document.fullscreenElement) {
                    await gameCanvas.requestFullscreen();
                } else {
                    await document.exitFullscreen();
                }
                gameCanvas.focus();
            } catch (error) {
                console.error('Fullscreen request failed:', error);
            }
        });

        document.addEventListener('fullscreenchange', () => {
            fullscreenButton.textContent = document.fullscreenElement ? '⛶ Exit Fullscreen' : '⛶ Fullscreen';
            gameCanvas.focus();
        });

        pickButton.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            if (file) runMainSystem(file);
        });

        // Reads the LOCAL file the user picked. Nothing is uploaded anywhere;
        // this all happens in-browser via the File API.
        function readLocalFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onprogress = (e) => {
                    if (e.lengthComputable) {
                        const percent = ((e.loaded / e.total) * 100).toFixed(0);
                        progressElement.style.width = `${percent}%`;
                        statusElement.innerText = `Reading local file: ${percent}%`;
                    }
                };
                reader.onload = () => resolve(new Uint8Array(reader.result));
                reader.onerror = () => reject(reader.error || new Error('Failed to read local file.'));
                reader.readAsArrayBuffer(file);
            });
        }

        async function runMainSystem(file) {
            try {
                picker.style.display = 'none';
                progressBar.style.display = 'block';
                statusElement.innerText = `Reading local file: 0%`;

                const gameUint8Array = await readLocalFile(file);

                statusElement.innerText = "Waking up WebAssembly emulator runtime...";

                const emuConfig = {
                    canvas: gameCanvas,
                    print: (text) => console.log('EMU: ' + text),
                    printErr: (text) => console.error('EMU-ERR: ' + text),
                    setStatus: (text) => { if(text) statusElement.innerText = text; },
                    locateFile: (path) => path
                };

                const playJsModule = await import('./Play.js');
                const createEmulatorCore = playJsModule.default;

                if (typeof createEmulatorCore !== 'function') {
                    throw new Error("Play.js did not export a default initialization module function framework.");
                }

                statusElement.innerText = "Executing hardware cold-boot cycle...";
                progressBar.style.display = 'none';
                canvasContainer.style.display = 'flex';

                const PlayModule = await createEmulatorCore(emuConfig);

                let readDone = true;
                PlayModule.discImageDevice = {
                    getFileSize: () => gameUint8Array.length,
                    read: (dstPtr, offset, size) => {
                        readDone = false;
                        PlayModule.HEAPU8.set(gameUint8Array.subarray(offset, offset + size), dstPtr);
                        readDone = true;
                    },
                    isDone: () => readDone
                };

                try { PlayModule.FS.mkdir('/work'); } catch (e) { /* already exists on a re-run */ }

                PlayModule.ccall('initVm', '', [], []);
                PlayModule.bootDiscImage(file.name);

                statusElement.innerText = "Running!";
                requestAnimationFrame(() => gameCanvas.focus());

            } catch (error) {
                statusElement.innerText = "System Fault: " + error.message;
                statusElement.style.color = "#f87171";
                console.error("BOOT CRASH LOG:", error);
            }
        }
    </script>
</body>
</html>
